<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync & Split: Echo Rebound</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            background: #0b0f19;
            margin: 0 auto;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">انقر لتحريك الكرات وتجاوز الحواجز</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth > 500 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let isGameOver = false;
        let gameSpeed = 3;
        let obstacles = [];
        
        let isReboundActive = false;
        let reboundTimer = 0;
        let flashAlpha = 0;

        // إحداثيات الكرات
        const leftBall = {
            x: canvas.width / 4,
            y: canvas.height - 120,
            radius: 16,
            color: '#00f3ff',
            targetX: canvas.width / 4
        };

        const rightBall = {
            x: (canvas.width / 4) * 3,
            y: canvas.height - 120,
            radius: 16,
            color: '#ff0055',
            targetX: (canvas.width / 4) * 3
        };

        // التحكم: النقر يمين أو يسار الشاشة يبدل موضع الكرة أفقياً لتتجنب الحاجز
        window.addEventListener('pointerdown', (e) => {
            if (isGameOver) {
                resetGame();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                // تبديل موقع الكرة اليسرى يميناً أو يساراً داخل نصفها
                leftBall.targetX = leftBall.targetX === canvas.width / 4 ? (canvas.width / 4) - 50 : canvas.width / 4;
            } else {
                // تبديل موقع الكرة اليمنى
                rightBall.targetX = rightBall.targetX === (canvas.width / 4) * 3 ? ((canvas.width / 4) * 3) + 50 : (canvas.width / 4) * 3;
            }
        });

        function spawnObstacle() {
            const halfW = canvas.width / 2;
            
            // توليد عائق في النصف الأيسر بفتحة عبور
            let leftGapPos = Math.random() * (halfW - 80) + 20;
            // توليد عائق في النصف الأيمن بفتحة عبور
            let rightGapPos = halfW + (Math.random() * (halfW - 80) + 20);

            obstacles.push({
                y: -50,
                height: 22,
                // اليسار: قطعتان تتركان فراغا في المنتصف لمرور الكرة اليسرى
                leftBlock1: { x: 10, width: leftGapPos - 10 },
                leftBlock2: { x: leftGapPos + 70, width: halfW - (leftGapPos + 70) },
                // اليمين: قطعتان تتركان فراغا لمرور الكرة اليمنى
                rightBlock1: { x: halfW + 10, width: (rightGapPos - halfW) - 10 },
                rightBlock2: { x: rightGapPos + 70, width: canvas.width - (rightGapPos + 70) - 10 },
                passed: false
            });
        }

        let spawnTimer = 0;

        function update() {
            if (isGameOver) return;

            if (isReboundActive) {
                reboundTimer--;
                flashAlpha = Math.sin(reboundTimer * 0.3) * 0.5 + 0.5;
                if (reboundTimer <= 0) {
                    isReboundActive = false;
                    flashAlpha = 0;
                }
            }

            leftBall.x += (leftBall.targetX - leftBall.x) * 0.2;
            rightBall.x += (rightBall.targetX - rightBall.x) * 0.2;

            gameSpeed += 0.0004;

            spawnTimer++;
            if (spawnTimer > 100) { // مسافة مريحة بين الحواجز
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;

                let obs = obstacles[i];

                // التحقق من اصطدام الكرة اليسرى بأي من قطعتي الحاجز الأيسر
                let hitLeft = (
                    leftBall.y + leftBall.radius > obs.y && leftBall.y - leftBall.radius < obs.y + obs.height &&
                    (
                        (leftBall.x + leftBall.radius > obs.leftBlock1.x && leftBall.x - leftBall.radius < obs.leftBlock1.x + obs.leftBlock1.width) ||
                        (leftBall.x + leftBall.radius > obs.leftBlock2.x && leftBall.x - leftBall.radius < obs.leftBlock2.x + obs.leftBlock2.width)
                    )
                );

                // التحقق من اصطدام الكرة اليمنى بأي من قطعتي الحاجز الأيمن
                let hitRight = (
                    rightBall.y + rightBall.radius > obs.y && rightBall.y - rightBall.radius < obs.y + obs.height &&
                    (
                        (rightBall.x + rightBall.radius > obs.rightBlock1.x && rightBall.x - rightBall.radius < obs.rightBlock1.x + obs.rightBlock1.width) ||
                        (rightBall.x + rightBall.radius > obs.rightBlock2.x && rightBall.x - rightBall.radius < obs.rightBlock2.x + obs.rightBlock2.width)
                    )
                );

                if (hitLeft || hitRight) {
                    if (!isReboundActive) {
                        isReboundActive = true;
                        reboundTimer = 25;
                        leftBall.targetX = canvas.width / 4;
                        rightBall.targetX = (canvas.width / 4) * 3;
                    } else {
                        isGameOver = true;
                    }
                }

                if (!obs.passed && obs.y > canvas.height) {
                    score += 10;
                    obs.passed = true;
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(0, 243, 255, ${flashAlpha * 0.2})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // خط المنتصف
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // رسم الحواجز بفتحات واضحة
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';
            
            for (let obs of obstacles) {
                // اليسار
                ctx.fillRect(obs.leftBlock1.x, obs.y, obs.leftBlock1.width, obs.height);
                ctx.fillRect(obs.leftBlock2.x, obs.y, obs.leftBlock2.width, obs.height);
                // اليمين
                ctx.fillRect(obs.rightBlock1.x, obs.y, obs.rightBlock1.width, obs.height);
                ctx.fillRect(obs.rightBlock2.x, obs.y, obs.rightBlock2.width, obs.height);
            }

            // رسم الكرات
            ctx.fillStyle = leftBall.color;
            ctx.shadowColor = leftBall.color;
            ctx.beginPath();
            ctx.arc(leftBall.x, leftBall.y, leftBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rightBall.color;
            ctx.shadowColor = rightBall.color;
            ctx.beginPath();
            ctx.arc(rightBall.x, rightBall.y, rightBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            document.getElementById('ui').innerText = isGameOver ? 
                `انتهت اللعبة! النتيجة: ${score}\nانقر لإعادة المحاولة` : 
                `النقاط: ${score}`;
        }

        function resetGame() {
            score = 0;
            gameSpeed = 3;
            obstacles = [];
            isGameOver = false;
            isReboundActive = false;
            leftBall.targetX = canvas.width / 4;
            rightBall.targetX = (canvas.width / 4) * 3;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
