<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync & Split</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            background: #0b0f19;
            margin: 0 auto;
        }
        #ui {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">اضغط واستمر للتباعد، ارفع إصبعك للتقارب</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth > 500 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let isGameOver = false;
        let gameSpeed = 3.5;
        let obstacles = [];
        let isTouching = false;

        // إحداثيات المواضع الثابتة (الداخل والخارج)
        const leftInner = () => canvas.width / 2 - 45;
        const leftOuter = () => 45;
        const rightInner = () => canvas.width / 2 + 45;
        const rightOuter = () => canvas.width - 45;

        const leftBall = {
            x: leftInner(),
            y: canvas.height - 130,
            radius: 16,
            color: '#00f3ff',
            targetX: leftInner()
        };

        const rightBall = {
            x: rightInner(),
            y: canvas.height - 130,
            radius: 16,
            color: '#ff0055',
            targetX: rightInner()
        };

        // التحكم: الضغط يبعد الكرتين للخارج، والرفع يعيدهما للداخل
        window.addEventListener('pointerdown', () => {
            if (isGameOver) {
                resetGame();
                return;
            }
            isTouching = true;
        });

        window.addEventListener('pointerup', () => {
            isTouching = false;
        });

        function spawnObstacle() {
            // نوعان فقط من الحواجز بشكل واضح جداً:
            // type 0: الحاجز يغلق الأطراف ويترك المنتصف مفتوحاً (تحتاج عدم الضغط)
            // type 1: الحاجز يغلق المنتصف ويترك الأطراف مفتوحة (تحتاج الضغط والاستمرار)
            const type = Math.random() < 0.5 ? 0 : 1;
            
            obstacles.push({
                y: -40,
                height: 24,
                type: type,
                passed: false
            });
        }

        let spawnTimer = 0;

        function update() {
            if (isGameOver) return;

            // تحديث الأهداف بناء على الضغط
            if (isTouching) {
                leftBall.targetX = leftOuter();
                rightBall.targetX = rightOuter();
            } else {
                leftBall.targetX = leftInner();
                rightBall.targetX = rightInner();
            }

            // حركة ناعمة وسريعة للكرات
            leftBall.x += (leftBall.targetX - leftBall.x) * 0.25;
            rightBall.x += (rightBall.targetX - rightBall.x) * 0.25;

            gameSpeed += 0.0003;

            spawnTimer++;
            if (spawnTimer > 90) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                // التثبت من الاصطدام عند وصول الحاجز لارتفاع الكرات
                if (Math.abs(obs.y - leftBall.y) < leftBall.radius + obs.height / 2) {
                    if (obs.type === 0) {
                        // الممر في المنتصف: تخسر إذا كانت الكرات في الأطراف (الخارج)
                        if (leftBall.x < leftInner() - 20 || rightBall.x > rightInner() + 20) {
                            isGameOver = true;
                        }
                    } else if (obs.type === 1) {
                        // الممر في الأطراف: تخسر إذا كانت الكرات في المنتصف (الداخل)
                        if (leftBall.x > leftOuter() + 30 || rightBall.x < rightOuter() - 30) {
                            isGameOver = true;
                        }
                    }
                }

                if (!obs.passed && obs.y > canvas.height) {
                    score += 10;
                    obs.passed = true;
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // خط المنتصف
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // رسم الحواجز
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';

            for (let obs of obstacles) {
                if (obs.type === 0) {
                    // فتحة بالمنتصف: نرسم كتلة باليسار وكتلة باليمين
                    ctx.fillRect(0, obs.y, leftInner() - 25, obs.height);
                    ctx.fillRect(rightInner() + 25, obs.y, canvas.width - (rightInner() + 25), obs.height);
                } else {
                    // فتحة بالأطراف: نرسم كتلة واحدة بالمنتصف تمنع المرور الداخلي
                    const centerWidth = rightInner() - leftInner() + 40;
                    ctx.fillRect(canvas.width / 2 - centerWidth / 2, obs.y, centerWidth, obs.height);
                }
            }

            // رسم الكرات
            ctx.fillStyle = leftBall.color;
            ctx.shadowColor = leftBall.color;
            ctx.beginPath();
            ctx.arc(leftBall.x, leftBall.y, leftBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rightBall.color;
            ctx.shadowColor = rightBall.color;
            ctx.beginPath();
            ctx.arc(rightBall.x, rightBall.y, rightBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            document.getElementById('ui').innerText = isGameOver ? 
                `انتهت اللعبة! النتيجة: ${score}\nاضغط لإعادة المحاولة` : 
                `النقاط: ${score}`;
        }

        function resetGame() {
            score = 0;
            gameSpeed = 3.5;
            obstacles = [];
            isGameOver = false;
            isTouching = false;
            leftBall.targetX = leftInner();
            rightBall.targetX = rightInner();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
