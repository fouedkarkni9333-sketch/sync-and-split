<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync & Split: Echo Rebound</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            background: #0b0f19;
            margin: 0 auto;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">المس الجانبين للتحكم</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth > 500 ? 450 : window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let isGameOver = false;
        let gameSpeed = 4;
        let obstacles = [];
        
        let isReboundActive = false;
        let reboundTimer = 0;
        let flashAlpha = 0;

        // أماكن الكرات (اليسرى واليمنى بمسافة آمنة عن الحواف)
        const leftBall = {
            x: canvas.width / 4,
            y: canvas.height - 120,
            radius: 18,
            color: '#00f3ff',
            defaultX: canvas.width / 4,
            targetX: canvas.width / 4
        };

        const rightBall = {
            x: (canvas.width / 4) * 3,
            y: canvas.height - 120,
            radius: 18,
            color: '#ff0055',
            defaultX: (canvas.width / 4) * 3,
            targetX: (canvas.width / 4) * 3
        };

        // التحكم باللمس أو الماوس (الضغط يبعد الكرة نحو الخارج)
        window.addEventListener('pointerdown', (e) => {
            if (isGameOver) {
                resetGame();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                leftBall.targetX = 30; // التحرك لأقصى اليسار
            } else {
                rightBall.targetX = canvas.width - 30; // التحرك لأقصى اليمين
            }
        });

        window.addEventListener('pointerup', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                leftBall.targetX = leftBall.defaultX;
            } else {
                rightBall.targetX = rightBall.defaultX;
            }
        });

        function spawnObstacle() {
            // عرض العائق يتناسب مع نصف الشاشة مع ترك مساحة فارغة للمرور
            const sideWidth = (canvas.width / 2) - 40;
            const isLeft = Math.random() < 0.5;
            
            // عائق يظهر إما في جهة اليسار أو جهة اليمين حصرياً لتترك فرصة للمرور في النصف الآخر
            const x = isLeft ? 20 : canvas.width / 2 + 20;
            
            obstacles.push({
                x: x,
                y: -60,
                width: sideWidth,
                height: 25,
                passed: false
            });
        }

        let spawnTimer = 0;

        function update() {
            if (isGameOver) return;

            if (isReboundActive) {
                reboundTimer--;
                flashAlpha = Math.sin(reboundTimer * 0.3) * 0.5 + 0.5;
                if (reboundTimer <= 0) {
                    isReboundActive = false;
                    flashAlpha = 0;
                }
            }

            // حركة ناعمة للكرات
            leftBall.x += (leftBall.targetX - leftBall.x) * 0.2;
            rightBall.x += (rightBall.targetX - rightBall.x) * 0.2;

            gameSpeed += 0.0005;

            spawnTimer++;
            if (spawnTimer > 80) { // زيادة الفاصل الزمني قليلاً لإعطاء فرصة للتركيز
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;

                let hitLeft = (
                    leftBall.x + leftBall.radius > obstacles[i].x &&
                    leftBall.x - leftBall.radius < obstacles[i].x + obstacles[i].width &&
                    leftBall.y + leftBall.radius > obstacles[i].y &&
                    leftBall.y - leftBall.radius < obstacles[i].y + obstacles[i].height
                );

                let hitRight = (
                    rightBall.x + rightBall.radius > obstacles[i].x &&
                    rightBall.x - rightBall.radius < obstacles[i].x + obstacles[i].width &&
                    rightBall.y + rightBall.radius > obstacles[i].y &&
                    rightBall.y - rightBall.radius < obstacles[i].y + obstacles[i].height
                );

                if (hitLeft || hitRight) {
                    if (!isReboundActive) {
                        isReboundActive = true;
                        reboundTimer = 30;
                        // ارتداد عكسي للإنقاذ
                        leftBall.targetX = leftBall.defaultX + 40;
                        rightBall.targetX = rightBall.defaultX - 40;
                    } else {
                        isGameOver = true;
                    }
                }

                if (!obstacles[i].passed && obstacles[i].y > canvas.height) {
                    score += 10;
                    obstacles[i].passed = true;
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(0, 243, 255, ${flashAlpha * 0.2})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // خط المنتصف
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // العوائق
            ctx.shadowBlur = 15;
            for (let obs of obstacles) {
                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // الكرة اليسرى
            ctx.fillStyle = leftBall.color;
            ctx.shadowColor = leftBall.color;
            ctx.beginPath();
            ctx.arc(leftBall.x, leftBall.y, leftBall.radius, 0, Math.PI * 2);
            ctx.fill();

            // الكرة اليمنى
            ctx.fillStyle = rightBall.color;
            ctx.shadowColor = rightBall.color;
            ctx.beginPath();
            ctx.arc(rightBall.x, rightBall.y, rightBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            document.getElementById('ui').innerText = isGameOver ? 
                `انتهت اللعبة! النتيجة: ${score}\nانقر لإعادة المحاولة` : 
                `النقاط: ${score}`;
        }

        function resetGame() {
            score = 0;
            gameSpeed = 4;
            obstacles = [];
            isGameOver = false;
            isReboundActive = false;
            leftBall.targetX = leftBall.defaultX;
            rightBall.targetX = rightBall.defaultX;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
