<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync & Split: Hardcore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative overflow-hidden">

    <!-- واجهة التحدي -->
    <div id="ui-overlay" class="absolute top-6 w-full max-w-md px-4 text-center pointer-events-none z-10 flex flex-col items-center">
        <h1 class="text-3xl font-black tracking-widest text-rose-500 drop-shadow-[0_0_12px_rgba(255,42,95,0.8)] mb-1">SYNC & SPLIT</h1>
        <div class="flex gap-6 text-lg font-bold text-gray-200 tracking-wider">
            <div id="score-display">النقاط: 0</div>
            <div id="best-score-display" class="text-amber-400">الرقم القياسي: 0</div>
        </div>
        <p class="text-xs font-bold text-rose-400 mt-2 bg-rose-950/60 px-4 py-1.5 rounded-full border border-rose-700/50">
            وضع التحدي الصعب: التركيز المطلق مطلوب!
        </p>
    </div>

    <!-- شاشة الخسارة -->
    <div id="game-over-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-20 flex flex-col items-center justify-center p-6 text-center">
        <h2 class="text-5xl font-black text-rose-600 tracking-wider mb-2 drop-shadow-[0_0_20px_rgba(255,0,0,0.8)]">سقطت في الاختبار!</h2>
        <div class="text-gray-300 text-lg mb-1">النتيجة النهائية</div>
        <div id="final-score" class="text-6xl font-extrabold text-cyan-400 mb-6">0</div>
        <button id="restart-btn" class="pointer-events-auto px-8 py-3.5 bg-gradient-to-r from-rose-500 to-red-600 text-white font-bold text-lg rounded-full shadow-[0_0_20px_rgba(255,0,0,0.5)] transform active:scale-95 transition-all cursor-pointer">
            حاول مجدداً
        </button>
    </div>

    <canvas id="gameCanvas" class="bg-slate-950 shadow-2xl border-x border-slate-800/40"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreDisplay = document.getElementById('score-display');
        const bestScoreDisplay = document.getElementById('best-score-display');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreDisplay = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        let width, height;
        function resizeCanvas() {
            width = Math.min(window.innerWidth, 480);
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let bestScore = localStorage.getItem('sync_split_hardcore_best') || 0;
        bestScoreDisplay.innerText = `الرقم القياسي: ${bestScore}`;

        let isGameOver = false;
        let gameSpeed = 5.0; // سرعة عالية وصعبة منذ البداية
        let obstacles = [];
        let spawnTimer = 0;
        let spawnInterval = 75; // مسافات أقصر بكثير بين الحواجز لزيادة الضغط

        let isLeftPressed = false;
        let isRightPressed = false;

        const ballRadius = 15;
        const leftBaseX = () => width / 4;
        const leftOuterX = () => 40;
        const rightBaseX = () => (width / 4) * 3;
        const rightOuterX = () => width - 40;

        const leftBall = { x: leftBaseX(), y: 0, radius: ballRadius, color: '#00f3ff', targetX: leftBaseX() };
        const rightBall = { x: rightBaseX(), y: 0, radius: ballRadius, color: '#ff0055', targetX: rightBaseX() };

        function resetBallPositions() {
            leftBall.y = height - 140;
            rightBall.y = height - 140;
            leftBall.targetX = leftBaseX();
            rightBall.targetX = rightBaseX();
            leftBall.x = leftBaseX();
            rightBall.x = rightBaseX();
        }

        // تحكم باللمس دقيق وسريع
        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e.touches); }, { passive: false });
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e.touches); }, { passive: false });
        window.addEventListener('touchend', (e) => { e.preventDefault(); handleTouch(e.touches); }, { passive: false });

        function handleTouch(touches) {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            let lActive = false, rActive = false;
            for (let i = 0; i < touches.length; i++) {
                if (touches[i].clientX - rect.left < width / 2) lActive = true;
                else rActive = true;
            }
            isLeftPressed = lActive;
            isRightPressed = rActive;
        }

        window.addEventListener('mousedown', (e) => {
            if (isGameOver) return;
            if (e.clientX - canvas.getBoundingClientRect().left < width / 2) isLeftPressed = true;
            else isRightPressed = true;
        });
        window.addEventListener('mouseup', (e) => {
            if (e.clientX - canvas.getBoundingClientRect().left < width / 2) isLeftPressed = false;
            else isRightPressed = false;
        });

        function spawnObstacle() {
            const type = Math.random() < 0.5 ? 0 : 1;
            obstacles.push({ y: -40, height: 24, type: type, passed: false });
        }

        function update() {
            if (isGameOver) return;

            leftBall.targetX = isLeftPressed ? leftOuterX() : leftBaseX();
            rightBall.targetX = isRightPressed ? rightOuterX() : rightBaseX();

            // استجابة أسرع وأكثر حقة للكرات
            leftBall.x += (leftBall.targetX - leftBall.x) * 0.4;
            rightBall.x += (rightBall.targetX - rightBall.x) * 0.4;

            // تصاعد جنوني للسرعة مع كل نقطة يحرزها اللاعب
            gameSpeed = 5.0 + (score * 0.04);
            
            // تقليل الفاصل الزمني تدريجياً لزيادة الصعوبة أكثر
            spawnTimer++;
            let dynamicInterval = Math.max(45, spawnInterval - Math.floor(score / 50) * 5);
            if (spawnTimer > dynamicInterval) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                const inHitZone = Math.abs(obs.y - leftBall.y) < (leftBall.radius + obs.height / 2);

                if (inHitZone) {
                    if (obs.type === 0) {
                        if (leftBall.x < leftBaseX() - 22 || rightBall.x > rightBaseX() + 22) {
                            triggerGameOver();
                        }
                    } else {
                        if (leftBall.x > leftOuterX() + 28 || rightBall.x < rightOuterX() - 28) {
                            triggerGameOver();
                        }
                    }
                }

                if (!obs.passed && obs.y > leftBall.y + leftBall.radius) {
                    score += 10;
                    scoreDisplay.innerText = `النقاط: ${score}`;
                    obs.passed = true;
                }

                if (obs.y > height + 50) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(width / 2, height);
            ctx.stroke();
            ctx.setLineDash([]);

            // حواجز بلون أحمر ناري يشير للصعوبة
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';

            for (let obs of obstacles) {
                if (obs.type === 0) {
                    ctx.fillRect(0, obs.y, leftBaseX() - 25, obs.height);
                    ctx.fillRect(rightBaseX() + 25, obs.y, width - (rightBaseX() + 25), obs.height);
                } else {
                    ctx.fillRect(leftOuterX() + 25, obs.y, (rightOuterX() - 25) - (leftOuterX() + 25), obs.height);
                }
            }

            ctx.fillStyle = leftBall.color;
            ctx.shadowColor = leftBall.color;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(leftBall.x, leftBall.y, leftBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rightBall.color;
            ctx.shadowColor = rightBall.color;
            ctx.beginPath();
            ctx.arc(rightBall.x, rightBall.y, rightBall.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function triggerGameOver() {
            isGameOver = true;
            if (navigator.vibrate) navigator.vibrate(300); // اهتزاز قوي عند السقوط

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('sync_split_hardcore_best', bestScore);
                bestScoreDisplay.innerText = `الرقم القياسي: ${bestScore}`;
            }

            finalScoreDisplay.innerText = score;
            gameOverModal.classList.remove('hidden');
        }

        function restartGame() {
            score = 0;
            gameSpeed = 5.0;
            obstacles = [];
            spawnTimer = 0;
            isLeftPressed = false;
            isRightPressed = false;
            isGameOver = false;
            scoreDisplay.innerText = `النقاط: ${score}`;
            resetBallPositions();
            gameOverModal.classList.add('hidden');
        }

        restartBtn.addEventListener('click', restartGame);

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        resetBallPositions();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
